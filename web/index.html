<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIC Search Console</title>
  <style>
    :root{--bg:#09100e;--panel:#111b18;--line:#263a33;--text:#ecf5f0;--muted:#91a79d;--mint:#76e2b2;--orange:#ffb36b;--red:#ff7c73}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#173129 0,transparent 32%),var(--bg);color:var(--text);font:14px Inter,Segoe UI,system-ui,sans-serif}button,input,select{font:inherit}
    header{position:sticky;top:0;z-index:5;background:#09100eea;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .head{max-width:1480px;margin:auto;padding:18px 24px}.brand{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.brand h1{font-size:20px;margin:0;letter-spacing:.08em}.brand span,.muted{color:var(--muted)}
    .search{display:grid;grid-template-columns:1fr 110px 110px 92px;gap:9px}input,select{width:100%;border:1px solid #365148;background:#101b18;color:var(--text);border-radius:11px;padding:13px 14px;outline:none}input:focus{border-color:var(--mint);box-shadow:0 0 0 3px #76e2b218}
    button{border:0;border-radius:10px;padding:11px 14px;background:var(--mint);color:#092017;font-weight:700;cursor:pointer}button.secondary{background:#1b2b26;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:wait}
    main{max-width:1480px;margin:auto;padding:18px 24px 60px}.summary{display:flex;gap:12px;align-items:center;min-height:36px;margin-bottom:14px}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--mint);font-weight:700}.error{color:var(--red)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{background:linear-gradient(150deg,#14211d,#0e1714);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#416257}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#050807;display:block}.body{padding:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.rank{color:var(--orange);font-weight:800}.video{font-size:16px;font-weight:800}.score{color:var(--mint);font-variant-numeric:tabular-nums}.meta{color:var(--muted);font-size:12px;margin:7px 0}.context{height:58px;overflow:hidden;line-height:1.45}.actions{display:flex;gap:8px;margin-top:10px}.actions button{padding:8px 10px;font-size:12px;flex:1}
    dialog{width:min(1050px,94vw);border:1px solid #3e5e53;border-radius:16px;background:#0c1512;color:var(--text);padding:0;box-shadow:0 30px 100px #000b}dialog::backdrop{background:#000b}.modalhead{display:flex;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}dialog video{display:block;width:100%;max-height:70vh;background:#000}.answer{padding:14px;border:1px solid #604a2e;background:#2a2016;border-radius:12px;margin-bottom:14px;color:#ffd8a8;font-size:16px}.loader{width:18px;height:18px;border:2px solid #49645b;border-top-color:var(--mint);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .subs{margin:0 0 18px;background:#0e1714;border:1px solid var(--line);border-radius:14px;overflow:hidden}.subshead{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line)}.subscroll{max-height:320px;overflow:auto}.subrow{display:grid;grid-template-columns:48px 1fr 76px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #1b2a25}.subrow:last-child{border:0}.subformat{font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cbe8db}.subrow button{padding:6px 8px;font-size:11px}
    @media(max-width:650px){.search{grid-template-columns:1fr 1fr 90px}.search input{grid-column:1/-1}.brand span{display:none}main,.head{padding-left:12px;padding-right:12px}}
  </style>
</head>
<body>
<header><div class="head"><div class="brand"><h1>AIC / SEARCH CONSOLE</h1><span>Local multimodal retrieval</span></div><div class="search"><input id="query" placeholder="Mô tả cảnh, đặt câu hỏi, hoặc nhập chuỗi sự kiện…" autofocus><select id="task"><option value="AUTO">Tự nhận diện</option><option value="KIS">KIS</option><option value="QA">QA</option><option value="TRAKE">TRAKE</option></select><select id="limit"><option value="20">Top 20</option><option value="50">Top 50</option><option value="100">Top 100</option></select><button id="search">Tìm kiếm</button></div></div></header>
<main><div id="summary" class="summary"><span class="muted">Nhập query để bắt đầu.</span></div><div id="answer"></div><div id="submissions"></div><section id="results" class="grid"></section></main>
<dialog id="player"><div class="modalhead"><b id="playerTitle"></b><button class="secondary" onclick="player.close()">Đóng</button></div><video id="video" controls preload="metadata"></video></dialog>
<script>
const $=s=>document.querySelector(s),query=$('#query'),button=$('#search'),summary=$('#summary'),results=$('#results'),answer=$('#answer'),submissions=$('#submissions'),player=$('#player'),video=$('#video');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(path,body)=>{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.detail||data.error||response.statusText);return data};
function openVideo(videoId,time){$('#playerTitle').textContent=`${videoId} · ${Number(time).toFixed(2)}s`;video.src=`/video?video_id=${encodeURIComponent(videoId)}#t=${Math.max(0,Number(time)-2)}`;player.showModal();video.onloadedmetadata=()=>{video.currentTime=Math.max(0,Number(time)-2);video.play().catch(()=>{})}}
function copyResult(videoId,frameId){navigator.clipboard.writeText(`${videoId},${frameId}`)}
function copyText(value){navigator.clipboard.writeText(value)}
function copyEncoded(value){copyText(decodeURIComponent(value))}
function submissionTable(items,title='Submission theo thể lệ'){const rows=items||[];if(!rows.length){submissions.innerHTML='';return}const all=encodeURIComponent(rows.map(x=>x.format||`${x.video_id},${x.frame_id}`).join("\n"));submissions.innerHTML=`<section class="subs"><div class="subshead"><b>${esc(title)} (${rows.length})</b><button class="secondary" onclick="copyEncoded('${all}')">Copy tất cả</button></div><div class="subscroll">${rows.map((x,i)=>{const value=x.format||`${x.video_id},${x.frame_id}`,encoded=encodeURIComponent(value);return `<div class="subrow"><span class="rank">#${x.rank||i+1}</span><span class="subformat" title="${esc(value)}">${esc(value)}</span><button class="secondary" onclick="copyEncoded('${encoded}')">Copy</button></div>`}).join('')}</div></section>`}
function cards(items){results.innerHTML=(items||[]).map(x=>`<article class="card"><img class="thumb" loading="lazy" src="/frame?video_id=${encodeURIComponent(x.video_id)}&frame_id=${x.best_frame_id}" alt="${esc(x.video_id)} frame ${x.best_frame_id}"><div class="body"><div class="row"><div><span class="rank">#${x.rank}</span> <span class="video">${esc(x.video_id)}</span></div><span class="score">${Number(x.fusion_score).toFixed(4)}</span></div><div class="meta">scene ${x.scene_index} · ${Number(x.start_time).toFixed(2)}–${Number(x.end_time).toFixed(2)}s · frame ${x.best_frame_id}</div><div class="context">${esc(x.scene_context)}</div><div class="actions"><button class="secondary" onclick="openVideo('${esc(x.video_id)}',${x.start_time})">Xem video</button><button class="secondary" onclick="copyResult('${esc(x.video_id)}',${x.best_frame_id})">Copy ID</button></div></div></article>`).join('')}
async function search(){const text=query.value.trim();if(!text)return;button.disabled=true;answer.innerHTML='';submissions.innerHTML='';results.innerHTML='';summary.innerHTML='<span class="loader"></span><span>Đang phân tích và truy vấn…</span>';const started=performance.now();try{const selected=$('#task').value;const route=selected==='AUTO'?await api('/route',{query:text}):{task:selected};const body={query:text,task:route.task,top_k:Number($('#limit').value)};if(route.task==='TRAKE'){const data=await api('/trake',body);summary.innerHTML=`<span class="pill">TRAKE</span><span>${((performance.now()-started)/1000).toFixed(2)} giây · video ${esc(data.alignment?.video_id||'-')}</span>`;submissionTable(data.submissions,'TRAKE: video_id, frame_id₁, …, frame_idₙ');const events=data.alignment?.events||[];results.innerHTML=events.map((x,i)=>`<article class="card"><img class="thumb" src="/frame?video_id=${encodeURIComponent(data.alignment.video_id)}&frame_id=${x.frame_id}"><div class="body"><div class="row"><b>Sự kiện ${i+1}</b><span class="score">frame ${x.frame_id}</span></div><div class="meta">${Number(x.pts_time).toFixed(2)}s · shot ${x.shot_id}</div><p>${esc(x.event)}</p><div class="actions"><button class="secondary" onclick="openVideo('${esc(data.alignment.video_id)}',${x.pts_time})">Xem khoảnh khắc</button><button class="secondary" onclick="copyText('${esc(data.alignment.video_id)},${x.frame_id}')">Copy frame</button></div></div></article>`).join('');return}
if(route.task==='QA'){const data=await api('/answer',body);const a=data.answer?.answer||data.answer?.final_answer||'Không có câu trả lời';answer.innerHTML=`<div class="answer"><b>Trả lời hạng 1:</b> ${esc(a)} · ${esc(data.answer?.video_id)} · frame ${data.answer?.frame_id}</div>`;summary.innerHTML=`<span class="pill">QA</span><span>${((performance.now()-started)/1000).toFixed(2)} giây</span>`;submissionTable(data.submissions,'QA: video_id, frame_id, answer');cards(data.retrieval?.results);return}
const data=await api('/query',body);summary.innerHTML=`<span class="pill">KIS</span><span>${data.results?.length||0} kết quả · ${Number(data.latency_seconds).toFixed(2)} giây</span>`;submissionTable(data.submissions,'KIS: video_id, frame_id');cards(data.results)}catch(error){summary.innerHTML=`<span class="error">Lỗi: ${esc(error.message)}</span>`}finally{button.disabled=false}}
button.onclick=search;query.onkeydown=e=>{if(e.key==='Enter')search()};player.addEventListener('close',()=>{video.pause();video.removeAttribute('src');video.load()});
</script></body></html>
