[project]
name = "aic-2026-pipeline"
version = "0.1.0"
description = "Offline preprocessing and retrieval pipeline for AIC HCMC 2026"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "opencv-python-headless>=4.11",
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "pandas>=2.2",
    "pillow>=11.0",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
]

[tool.uv]
package = false
