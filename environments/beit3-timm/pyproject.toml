[project]
name = "aic-beit3-timm-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "huggingface-hub>=0.34",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pillow>=11.0",
    "pyarrow>=18.0",
    "safetensors>=0.5",
    "timm>=1.0.20",
    "torch==2.6.0",
    "torchvision==0.21.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
package = false
