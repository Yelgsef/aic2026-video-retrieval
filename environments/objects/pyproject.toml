[project]
name = "aic-object-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pandas>=2.2",
  "pillow>=11.0",
  "pyarrow>=18.0",
  "safetensors>=0.5",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers>=4.49,<5",
  "ultralytics>=8.3,<9",
  "clip @ git+https://github.com/ultralytics/CLIP.git@488e81a6711eea7346872b46ea928b367da8889d",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
package = false
