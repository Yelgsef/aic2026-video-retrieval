[project]
name = "aic-siglip2-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "pillow>=11.0",
  "pyarrow>=18.0",
  "rapidfuzz>=3.10",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
    "pymilvus[milvus_lite]>=2.5.6,<3",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=4.49,<5",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
package = false
